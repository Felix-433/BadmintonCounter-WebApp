<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BadmintonCounter</title>
<meta name="theme-color" content="#122a4d">
<!-- iOS/iPadOS respektiert den Web-App-Manifest-"display: standalone" beim
     "Zum Home-Bildschirm"-Hinzufügen nicht zuverlässig — diese Apple-eigenen
     Tags sorgen zusätzlich dafür, dass die App dann wirklich ohne Safari-
     Oberfläche (Adressleiste, Tab-Leiste) startet. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BadmintonCounter">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>🏸 BadmintonCounter</h1>
    <nav class="tabs" id="nav">
      <button type="button" data-view="setup">Neues Match</button>
      <button type="button" data-view="history">Verlauf</button>
    </nav>
  </header>

  <main>
    <section id="view-setup" class="view">
      <form id="setup-form">
        <div class="options-row">
          <fieldset>
            <legend>Spielart</legend>
            <label class="radio"><input type="radio" name="match-type" value="doppel" checked> Doppel</label>
            <label class="radio"><input type="radio" name="match-type" value="einzel"> Einzel</label>
          </fieldset>

          <fieldset>
            <legend>Wer schlägt zuerst auf?</legend>
            <label class="radio"><input type="radio" name="first-server" value="A" checked> A</label>
            <label class="radio"><input type="radio" name="first-server" value="B"> B</label>
          </fieldset>

          <fieldset>
            <legend>Zählweise</legend>
            <label class="radio"><input type="radio" name="modus" value="bis21" checked> bis 21 (Cap 30)</label>
            <label class="radio"><input type="radio" name="modus" value="bis15"> bis 15 (Cap 21)</label>
          </fieldset>
        </div>

        <div class="team-group">
          <h3 class="team-heading">Team A</h3>
          <div class="team-fields">
            <label>Spieler A1
              <input id="input-a1" name="a1" autocomplete="off" value="A" required>
            </label>
            <label id="label-a2">Spieler A2
              <input id="input-a2" name="a2" autocomplete="off" value="B">
            </label>
          </div>
        </div>

        <div class="team-group">
          <h3 class="team-heading">Team B</h3>
          <div class="team-fields">
            <label>Spieler B1
              <input id="input-b1" name="b1" autocomplete="off" value="X" required>
            </label>
            <label id="label-b2">Spieler B2
              <input id="input-b2" name="b2" autocomplete="off" value="Y">
            </label>
          </div>
        </div>

        <button type="submit" class="primary">Match starten</button>
      </form>
    </section>

    <section id="view-live" class="view">
      <div class="top-row">
        <button type="button" class="serve-indicator" id="serve-a">🏸 Aufschlag</button>
        <div class="sets-summary" id="sets-summary"></div>
        <button type="button" class="serve-indicator" id="serve-b">🏸 Aufschlag</button>
      </div>

      <div id="new-set-prompt" class="new-set-banner hidden">
        <p id="new-set-title"></p>
        <fieldset>
          <legend id="new-set-legend-a">Team A</legend>
          <label class="radio"><input type="radio" name="new-set-a" value="0" checked> <span id="new-set-a1-name"></span></label>
          <label class="radio"><input type="radio" name="new-set-a" value="1"> <span id="new-set-a2-name"></span></label>
        </fieldset>
        <fieldset>
          <legend id="new-set-legend-b">Team B</legend>
          <label class="radio"><input type="radio" name="new-set-b" value="0" checked> <span id="new-set-b1-name"></span></label>
          <label class="radio"><input type="radio" name="new-set-b" value="1"> <span id="new-set-b2-name"></span></label>
        </fieldset>
        <button type="button" class="primary" id="btn-new-set-confirm">Weiter</button>
      </div>

      <div class="court">
        <button type="button" class="score-btn side-a" id="btn-a">
          <span class="player-name" id="name-a"></span>
          <span class="score" id="score-a">0</span>
        </button>
        <button type="button" class="score-btn side-b" id="btn-b">
          <span class="player-name" id="name-b"></span>
          <span class="score" id="score-b">0</span>
        </button>
      </div>

      <div class="live-controls">
        <button type="button" id="btn-undo">↶ Undo</button>
        <button type="button" id="btn-cancel">Match abbrechen</button>
      </div>

      <div id="match-over-banner" class="match-over-banner hidden">
        <p id="match-over-text"></p>
        <button type="button" class="primary" id="btn-save">Match speichern</button>
      </div>
    </section>

    <section id="view-history" class="view">
      <div class="history-header">
        <h2>Verlauf</h2>
        <div class="history-actions">
          <button type="button" id="btn-export">⬆ Sichern</button>
          <button type="button" id="btn-import">⬇ Wiederherstellen</button>
          <input type="file" id="input-import" accept="application/json" class="hidden">
        </div>
      </div>
      <p id="history-empty" class="empty hidden">Noch keine gespeicherten Matches.</p>
      <ul id="history-list"></ul>
    </section>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
