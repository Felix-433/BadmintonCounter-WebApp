<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer-Debug</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0e1b30; color: #f2f5fa; margin: 0; padding: 1rem; }
  h1 { font-size: 1.1rem; }
  #target {
    background: #1b3760; border: 2px dashed #ffb703; border-radius: 1rem;
    padding: 2rem; text-align: center; font-size: 1.2rem; margin-bottom: 1rem; user-select: none;
  }
  #log { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
  .entry { border-bottom: 1px solid #1b3760; padding: 0.4rem 0; }
  .entry b { color: #ffb703; }
  button { font-size: 1rem; padding: 0.5rem 1rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>Pointer-Debug — hier klicken/tippen (links, rechts, halten)</h1>
<div id="target">Hier klicken / tippen / halten</div>
<button id="clear">Log leeren</button>
<div id="log"></div>
<script>
const target = document.getElementById('target');
const log = document.getElementById('log');
document.getElementById('clear').addEventListener('click', () => { log.textContent = ''; });

function record(type, e) {
  const div = document.createElement('div');
  div.className = 'entry';
  const fields = {
    pointerType: e.pointerType ?? '-',
    button: e.button,
    width: e.width ?? '-',
    height: e.height ?? '-',
    pressure: e.pressure ?? '-',
    isPrimary: e.isPrimary ?? '-',
  };
  div.innerHTML = `<b>${type}</b> @ ${new Date().toLocaleTimeString('de-DE')}  ` +
    Object.entries(fields).map(([k, v]) => `${k}=${v}`).join(' ');
  log.prepend(div);
}

['pointerdown', 'pointerup', 'pointermove', 'pointercancel'].forEach((evt) => {
  target.addEventListener(evt, (e) => {
    if (evt === 'pointermove' && log.children.length > 0 && log.children[0].textContent.includes('pointermove')) return; // nicht fluten
    record(evt, e);
  });
});

target.addEventListener('click', (e) => record('click', e));
target.addEventListener('contextmenu', (e) => { e.preventDefault(); record('contextmenu', e); });
target.addEventListener('mousedown', (e) => record('mousedown', e));
</script>
</body>
</html>
